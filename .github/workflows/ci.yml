name: rewards-service CI
on:
  push: { paths: ['rewards-service/**', '.github/workflows/ci.yml'] }
  pull_request: { paths: ['rewards-service/**'] }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: rewards-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: rewards-service/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
